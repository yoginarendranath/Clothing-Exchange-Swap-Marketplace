<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Swap Requests - Clothing Exchange</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f3ff;
            color: #222;
        }

        .navbar {
            background: #6c4ce8;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .section {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-bottom: 20px;
            color: #6c4ce8;
        }

        .request-card {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            background: #faf9ff;
        }

        .request-card h3 {
            margin-bottom: 10px;
        }

        .request-card p {
            margin: 7px 0;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .accepted {
            background: #d4edda;
            color: #155724;
        }

        .rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .accept {
            background: #28a745;
            color: white;
        }

        .reject {
            background: #dc3545;
            color: white;
        }

        .delete {
            background: #555;
            color: white;
        }

        .chat {
            background: #6c4ce8;
            color: white;
        }

        /* =========================
           DISPUTE BUTTON
        ========================= */

        .dispute {
            background: #f39c12;
            color: white;
        }

        .dispute:hover {
            background: #d68910;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 30px;
        }

        .error {
            color: #dc3545;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {

            .navbar {
                flex-direction: column;
                gap: 12px;
            }

            .navbar a {
                margin-left: 8px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<div class="navbar">

    <strong>Clothing Exchange</strong>

    <div>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="listings.html">
            Listings
        </a>

        <a href="chat.html">
            Chat
        </a>

    </div>

</div>


<div class="container">

    <h1>Swap Requests</h1>


    <!-- =========================
         RECEIVED REQUESTS
    ========================= -->

    <div class="section">

        <h2>📥 Incoming Requests</h2>

        <div id="receivedRequests">

            <div class="empty">
                Loading incoming requests...
            </div>

        </div>

    </div>


    <!-- =========================
         SENT REQUESTS
    ========================= -->

    <div class="section">

        <h2>📤 Sent Requests</h2>

        <div id="sentRequests">

            <div class="empty">
                Loading sent requests...
            </div>

        </div>

    </div>

</div>


<script>


    // =========================================
    // CURRENT USER
    // =========================================

    const loggedInUser =
        JSON.parse(
            localStorage.getItem("loggedInUser")
        );


    if (!loggedInUser) {

        alert(
            "Please login first."
        );

        window.location.href =
            "login.html";

    }


    const currentUserId =
        Number(loggedInUser.id);


    // =========================================
    // LOAD ALL REQUESTS
    // =========================================

    async function loadRequests() {

        await Promise.all([
            loadReceivedRequests(),
            loadSentRequests()
        ]);

    }


    // =========================================
    // RECEIVED REQUESTS
    // =========================================

    async function loadReceivedRequests() {

        const container =
            document.getElementById(
                "receivedRequests"
            );


        try {

            const response =
                await fetch(
                    `/api/swaps/owner/${currentUserId}`
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load incoming requests"
                );

            }


            const requests =
                await response.json();


            if (!requests.length) {

                container.innerHTML = `

                    <div class="empty">
                        No incoming swap requests.
                    </div>

                `;

                return;

            }


            container.innerHTML = "";


            requests.forEach(request => {

                container.appendChild(
                    createReceivedCard(request)
                );

            });


        } catch (error) {

            console.error(error);

            container.innerHTML = `

                <div class="error">
                    Unable to load incoming requests.
                </div>

            `;

        }

    }


    // =========================================
    // SENT REQUESTS
    // =========================================

    async function loadSentRequests() {

        const container =
            document.getElementById(
                "sentRequests"
            );


        try {

            const response =
                await fetch(
                    `/api/swaps/requester/${currentUserId}`
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load sent requests"
                );

            }


            const requests =
                await response.json();


            if (!requests.length) {

                container.innerHTML = `

                    <div class="empty">
                        You have not sent any swap requests.
                    </div>

                `;

                return;

            }


            container.innerHTML = "";


            requests.forEach(request => {

                container.appendChild(
                    createSentCard(request)
                );

            });


        } catch (error) {

            console.error(error);

            container.innerHTML = `

                <div class="error">
                    Unable to load sent requests.
                </div>

            `;

        }

    }


    // =========================================
    // RECEIVED REQUEST CARD
    // =========================================

    function createReceivedCard(request) {

        const card =
            document.createElement("div");

        card.className =
            "request-card";


        card.innerHTML = `

            <h3>
                Swap Request #${request.id}
            </h3>

            <p>
                <strong>Requester ID:</strong>
                ${request.requesterId}
            </p>

            <p>
                <strong>Requested Item ID:</strong>
                ${request.requestedItemId}
            </p>

            <p>
                <strong>Offered Item ID:</strong>
                ${request.offeredItemId}
            </p>

            <p>
                <strong>Message:</strong>
                ${escapeHtml(
                    request.message || "No message"
                )}
            </p>

            <p>
                <strong>Date:</strong>
                ${formatDate(request.createdAt)}
            </p>

            <span class="status ${request.status.toLowerCase()}">
                ${request.status}
            </span>

        `;


        const buttons =
            document.createElement("div");

        buttons.className =
            "buttons";


        // =========================================
        // ACCEPT / REJECT
        // =========================================

        if (request.status === "PENDING") {

            const acceptButton =
                document.createElement("button");

            acceptButton.className =
                "accept";

            acceptButton.innerText =
                "Accept";

            acceptButton.onclick =
                () =>
                    updateStatus(
                        request.id,
                        "ACCEPTED"
                    );


            const rejectButton =
                document.createElement("button");

            rejectButton.className =
                "reject";

            rejectButton.innerText =
                "Reject";

            rejectButton.onclick =
                () =>
                    updateStatus(
                        request.id,
                        "REJECTED"
                    );


            buttons.appendChild(
                acceptButton
            );

            buttons.appendChild(
                rejectButton
            );

        }


        // =========================================
        // CHAT
        // =========================================

        const chatButton =
            document.createElement("button");

        chatButton.className =
            "chat";

        chatButton.innerText =
            "Open Chat";


        chatButton.onclick =
            function() {

                window.location.href =
                    `chat.html?userId=${request.requesterId}`;

            };


        buttons.appendChild(
            chatButton
        );


        // =========================================
        // REPORT DISPUTE
        // =========================================

        const disputeButton =
            document.createElement("button");

        disputeButton.className =
            "dispute";

        disputeButton.innerText =
            "⚠️ Report Dispute";


        disputeButton.onclick =
            function() {

                window.location.href =
                    `report-dispute.html?swapRequestId=${request.id}`;

            };


        buttons.appendChild(
            disputeButton
        );


        // =========================================
        // DELETE
        // =========================================

        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete";

        deleteButton.innerText =
            "Delete";


        deleteButton.onclick =
            () =>
                deleteRequest(
                    request.id
                );


        buttons.appendChild(
            deleteButton
        );


        card.appendChild(
            buttons
        );


        return card;

    }


    // =========================================
    // SENT REQUEST CARD
    // =========================================

    function createSentCard(request) {

        const card =
            document.createElement("div");

        card.className =
            "request-card";


        card.innerHTML = `

            <h3>
                Swap Request #${request.id}
            </h3>

            <p>
                <strong>Owner ID:</strong>
                ${request.ownerId}
            </p>

            <p>
                <strong>Requested Item ID:</strong>
                ${request.requestedItemId}
            </p>

            <p>
                <strong>Your Offered Item ID:</strong>
                ${request.offeredItemId}
            </p>

            <p>
                <strong>Message:</strong>
                ${escapeHtml(
                    request.message || "No message"
                )}
            </p>

            <p>
                <strong>Date:</strong>
                ${formatDate(request.createdAt)}
            </p>

            <span class="status ${request.status.toLowerCase()}">
                ${request.status}
            </span>

        `;


        const buttons =
            document.createElement("div");

        buttons.className =
            "buttons";


        // =========================================
        // CHAT
        // =========================================

        const chatButton =
            document.createElement("button");

        chatButton.className =
            "chat";

        chatButton.innerText =
            "Open Chat";


        chatButton.onclick =
            function() {

                window.location.href =
                    `chat.html?userId=${request.ownerId}`;

            };


        buttons.appendChild(
            chatButton
        );


        // =========================================
        // REPORT DISPUTE
        // =========================================

        const disputeButton =
            document.createElement("button");

        disputeButton.className =
            "dispute";

        disputeButton.innerText =
            "⚠️ Report Dispute";


        disputeButton.onclick =
            function() {

                window.location.href =
                    `report-dispute.html?swapRequestId=${request.id}`;

            };


        buttons.appendChild(
            disputeButton
        );


        // =========================================
        // DELETE
        // =========================================

        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete";

        deleteButton.innerText =
            "Delete";


        deleteButton.onclick =
            () =>
                deleteRequest(
                    request.id
                );


        buttons.appendChild(
            deleteButton
        );


        card.appendChild(
            buttons
        );


        return card;

    }


    // =========================================
    // ACCEPT / REJECT
    // =========================================

    async function updateStatus(
        requestId,
        status
    ) {

        try {

            const response =
                await fetch(
                    `/api/swaps/${requestId}/status?ownerId=${currentUserId}&status=${status}`,
                    {
                        method: "PUT"
                    }
                );


            const result =
                await response.text();


            if (!response.ok) {

                alert(result);

                return;

            }


            alert(
                `Swap request ${status.toLowerCase()} successfully.`
            );


            loadRequests();


        } catch (error) {

            console.error(error);

            alert(
                "Unable to update swap request."
            );

        }

    }


    // =========================================
    // DELETE REQUEST
    // =========================================

    async function deleteRequest(
        requestId
    ) {

        if (
            !confirm(
                "Are you sure you want to delete this request?"
            )
        ) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/api/swaps/${requestId}?userId=${currentUserId}`,
                    {
                        method: "DELETE"
                    }
                );


            const result =
                await response.text();


            if (!response.ok) {

                alert(result);

                return;

            }


            loadRequests();


        } catch (error) {

            console.error(error);

            alert(
                "Unable to delete request."
            );

        }

    }


    // =========================================
    // HELPERS
    // =========================================

    function formatDate(date) {

        if (!date) {
            return "-";
        }

        return new Date(date)
            .toLocaleString(
                "en-IN"
            );

    }


    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text;

        return div.innerHTML;

    }


    // =========================================
    // START
    // =========================================

    loadRequests();

</script>

</body>

</html>
