<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Clothing - Clothing Exchange Marketplace</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        nav {
            background: #222;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 22px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .user-info {
            background: #f0f3ff;
            padding: 12px 15px;
            border-radius: 7px;
            margin-bottom: 25px;
            color: #444;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        .upload-button {
            margin-top: 10px;
            background: #667eea;
        }

        .upload-button:hover {
            background: #5568d9;
        }

        .upload-status {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .image-preview {
            display: none;
            margin-top: 15px;
            text-align: center;
        }

        .image-preview img {
            max-width: 250px;
            max-height: 250px;
            border-radius: 10px;
            border: 1px solid #ddd;
            object-fit: cover;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .row {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }

            nav {
                padding: 15px 5%;
            }

            nav h2 {
                font-size: 18px;
            }

            nav div {
                display: flex;
                flex-direction: column;
                gap: 5px;
            }

            nav a {
                margin-left: 0;
            }
        }

    </style>

</head>

<body>


<!-- =========================
     NAVBAR
========================= -->

<nav>

    <h2>
        Clothing Exchange
    </h2>

    <div>

        <a href="/dashboard.html">
            Dashboard
        </a>

        <a href="/listings.html">
            Listings
        </a>

    </div>

</nav>



<!-- =========================
     MAIN CONTAINER
========================= -->

<div class="container">

    <h1>
        👕 Add Clothing Item
    </h1>

    <p class="subtitle">
        List your clothing item for exchange
    </p>


    <!-- Logged-in user -->

    <div class="user-info">

        Listing as:
        <strong id="loggedInUserName">
            Loading...
        </strong>

    </div>



    <!-- =========================
         FORM
    ========================= -->

    <form id="itemForm">


        <!-- Title -->

        <div class="form-group">

            <label>
                Clothing Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Example: Levi's Denim Jacket"
                required>

        </div>



        <!-- Category + Size -->

        <div class="row">

            <div class="form-group">

                <label>
                    Category
                </label>

                <select
                    id="category"
                    required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Shirt">
                        Shirt
                    </option>

                    <option value="T-Shirt">
                        T-Shirt
                    </option>

                    <option value="Jeans">
                        Jeans
                    </option>

                    <option value="Trousers">
                        Trousers
                    </option>

                    <option value="Jacket">
                        Jacket
                    </option>

                    <option value="Hoodie">
                        Hoodie
                    </option>

                    <option value="Dress">
                        Dress
                    </option>

                    <option value="Skirt">
                        Skirt
                    </option>

                    <option value="Sweater">
                        Sweater
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Size
                </label>

                <select
                    id="size"
                    required>

                    <option value="">
                        Select Size
                    </option>

                    <option value="XS">
                        XS
                    </option>

                    <option value="S">
                        S
                    </option>

                    <option value="M">
                        M
                    </option>

                    <option value="L">
                        L
                    </option>

                    <option value="XL">
                        XL
                    </option>

                    <option value="XXL">
                        XXL
                    </option>

                </select>

            </div>

        </div>



        <!-- Brand + Condition -->

        <div class="row">

            <div class="form-group">

                <label>
                    Brand
                </label>

                <input
                    type="text"
                    id="brand"
                    placeholder="Example: Levi's">

            </div>


            <div class="form-group">

                <label>
                    Condition
                </label>

                <select
                    id="condition"
                    required>

                    <option value="">
                        Select Condition
                    </option>

                    <option value="New">
                        New
                    </option>

                    <option value="Like New">
                        Like New
                    </option>

                    <option value="Good">
                        Good
                    </option>

                    <option value="Fair">
                        Fair
                    </option>

                </select>

            </div>

        </div>



        <!-- Description -->

        <div class="form-group">

            <label>
                Description
            </label>

            <textarea
                id="description"
                placeholder="Describe the clothing item, color, usage, defects, etc."
                required></textarea>

        </div>



        <!-- Value + Location -->

        <div class="row">

            <div class="form-group">

                <label>
                    Estimated Value (₹)
                </label>

                <input
                    type="number"
                    id="estimatedValue"
                    placeholder="Example: 1500"
                    min="1"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Example: Indore"
                    required>

            </div>

        </div>



        <!-- =========================
             CLOUDINARY IMAGE UPLOAD
        ========================= -->

        <div class="form-group">

            <label>
                Clothing Image
            </label>

            <input
                type="file"
                id="imageFile"
                accept="image/*"
                required>

            <button
                type="button"
                id="uploadButton"
                class="upload-button">

                ☁️ Upload Image

            </button>

            <div
                id="uploadStatus"
                class="upload-status">
            </div>


            <!-- Image Preview -->

            <div
                id="imagePreview"
                class="image-preview">

                <img
                    id="previewImage"
                    src=""
                    alt="Clothing Preview">

            </div>

        </div>



        <!-- Hidden Cloudinary URL -->

        <input
            type="hidden"
            id="imageUrl">



        <!-- Submit -->

        <button
            type="submit"
            id="submitButton">

            Add Clothing Item

        </button>

    </form>



    <!-- Message -->

    <div id="message"></div>

</div>



<script>


// ==========================================
// GET LOGGED-IN USER
// ==========================================

const storedUser =
    localStorage.getItem("loggedInUser");


if (!storedUser) {

    alert(
        "Please login before adding a clothing item."
    );

    window.location.href =
        "/login.html";
}


// ==========================================
// PARSE USER
// ==========================================

let loggedInUser;

try {

    loggedInUser =
        JSON.parse(storedUser);

} catch (error) {

    localStorage.removeItem(
        "loggedInUser"
    );

    window.location.href =
        "/login.html";
}


// ==========================================
// DISPLAY USER NAME
// ==========================================

if (loggedInUser) {

    document
        .getElementById("loggedInUserName")
        .textContent =
        loggedInUser.name ||
        loggedInUser.email;

}



// ==========================================
// CLOUDINARY IMAGE UPLOAD
// ==========================================

document
    .getElementById("uploadButton")
    .addEventListener(
        "click",
        async function () {

            const fileInput =
                document.getElementById("imageFile");

            const uploadButton =
                document.getElementById("uploadButton");

            const uploadStatus =
                document.getElementById("uploadStatus");

            const imageUrl =
                document.getElementById("imageUrl");

            const imagePreview =
                document.getElementById("imagePreview");

            const previewImage =
                document.getElementById("previewImage");


            // Check file

            if (!fileInput.files ||
                fileInput.files.length === 0) {

                uploadStatus.textContent =
                    "❌ Please select an image first.";

                uploadStatus.className =
                    "upload-status error";

                return;
            }


            const file =
                fileInput.files[0];


            // Frontend file size check

            if (file.size > 5 * 1024 * 1024) {

                uploadStatus.textContent =
                    "❌ Image must be less than 5 MB.";

                uploadStatus.className =
                    "upload-status error";

                return;
            }


            // Check image type

            if (!file.type.startsWith("image/")) {

                uploadStatus.textContent =
                    "❌ Please select a valid image.";

                uploadStatus.className =
                    "upload-status error";

                return;
            }


            uploadButton.disabled = true;

            uploadButton.textContent =
                "Uploading...";

            uploadStatus.textContent =
                "☁️ Uploading image to Cloudinary...";

            uploadStatus.className =
                "upload-status";


            try {

                const formData =
                    new FormData();

                formData.append(
                    "file",
                    file
                );


                const response =
                    await fetch(
                        "/api/items/upload-image",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const result =
                    await response.text();


                if (!response.ok) {

                    throw new Error(
                        result ||
                        "Image upload failed."
                    );
                }


                const data =
                    JSON.parse(result);


                if (!data.imageUrl) {

                    throw new Error(
                        "Cloudinary image URL not received."
                    );
                }


                // Store Cloudinary URL

                imageUrl.value =
                    data.imageUrl;


                // Preview image

                previewImage.src =
                    data.imageUrl;

                imagePreview.style.display =
                    "block";


                uploadStatus.textContent =
                    "✅ Image uploaded successfully.";

                uploadStatus.className =
                    "upload-status success";


            } catch (error) {

                console.error(
                    "Image upload error:",
                    error
                );

                uploadStatus.textContent =
                    "❌ " +
                    error.message;

                uploadStatus.className =
                    "upload-status error";


                imageUrl.value = "";

            } finally {

                uploadButton.disabled = false;

                uploadButton.textContent =
                    "☁️ Upload Image";

            }

        }
    );



// ==========================================
// FORM SUBMIT
// ==========================================

document
    .getElementById("itemForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            // Make sure user is logged in

            if (!loggedInUser ||
                !loggedInUser.id) {

                alert(
                    "User information not found. Please login again."
                );

                window.location.href =
                    "/login.html";

                return;
            }


            // Make sure image uploaded

            const uploadedImageUrl =
                document
                    .getElementById("imageUrl")
                    .value
                    .trim();


            if (!uploadedImageUrl) {

                document
                    .getElementById("message")
                    .textContent =
                    "❌ Please upload a clothing image first.";

                document
                    .getElementById("message")
                    .className =
                    "error";

                return;
            }


            // Disable button

            const submitButton =
                document.getElementById(
                    "submitButton"
                );

            submitButton.disabled = true;

            submitButton.textContent =
                "Adding Item...";



            // ==================================
            // CREATE CLOTHING ITEM
            // ==================================

            const item = {

                title:
                    document
                        .getElementById("title")
                        .value
                        .trim(),

                category:
                    document
                        .getElementById("category")
                        .value,

                size:
                    document
                        .getElementById("size")
                        .value,

                brand:
                    document
                        .getElementById("brand")
                        .value
                        .trim(),

                condition:
                    document
                        .getElementById("condition")
                        .value,

                description:
                    document
                        .getElementById("description")
                        .value
                        .trim(),

                estimatedValue:
                    Number(
                        document
                            .getElementById(
                                "estimatedValue"
                            )
                            .value
                    ),

                location:
                    document
                        .getElementById("location")
                        .value
                        .trim(),

                imageUrl:
                    uploadedImageUrl,

                status:
                    "AVAILABLE",

                ownerId:
                    loggedInUser.id

            };


            // ==================================
            // SEND TO BACKEND
            // ==================================

            try {

                const response =
                    await fetch(
                        "/api/items",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(item)
                        }
                    );


                const result =
                    await response.text();


                // ==================================
                // SUCCESS
                // ==================================

                if (response.ok) {

                    document
                        .getElementById("message")
                        .textContent =
                        "✅ Clothing item added successfully!";

                    document
                        .getElementById("message")
                        .className =
                        "success";


                    document
                        .getElementById("itemForm")
                        .reset();


                    // Clear image preview

                    document
                        .getElementById("imagePreview")
                        .style.display =
                        "none";


                    document
                        .getElementById("imageUrl")
                        .value = "";


                    document
                        .getElementById("uploadStatus")
                        .textContent = "";


                    // Restore user name

                    document
                        .getElementById(
                            "loggedInUserName"
                        )
                        .textContent =
                        loggedInUser.name ||
                        loggedInUser.email;


                } else {

                    document
                        .getElementById("message")
                        .textContent =
                        "❌ Failed to add clothing item: " +
                        result;

                    document
                        .getElementById("message")
                        .className =
                        "error";

                }


            } catch (error) {

                console.error(
                    "Add item error:",
                    error
                );

                document
                    .getElementById("message")
                    .textContent =
                    "❌ Server connection failed.";

                document
                    .getElementById("message")
                    .className =
                    "error";

            }


            // Enable button again

            submitButton.disabled = false;

            submitButton.textContent =
                "Add Clothing Item";

        }
    );

</script>


</body>

</html>
