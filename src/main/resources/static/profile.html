<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Clothing Exchange</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4fbf7;
            color: #222;
        }

        .navbar {
            background: #198754;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar strong {
            font-size: 21px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .navbar a:hover {
            opacity: 0.85;
        }

        .container {
            width: 92%;
            max-width: 760px;
            margin: 35px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #198754;
            margin-bottom: 30px;
            text-align: center;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-image-wrapper {
            width: 145px;
            height: 145px;
            margin: 0 auto 15px;
        }

        #profileImage {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #198754;
            background: #eee;
        }

        .image-label {
            display: inline-block;
            background: #198754;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .image-label:hover {
            background: #146c43;
        }

        #imageInput {
            display: none;
        }

        .image-help {
            margin-top: 8px;
            color: #777;
            font-size: 13px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .field input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d5d5;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        .field input:focus {
            outline: none;
            border-color: #198754;
            box-shadow: 0 0 0 2px rgba(25, 135, 84, 0.08);
        }

        .field input:read-only {
            background: #f1f3f5;
            color: #777;
        }

        .field small {
            display: block;
            margin-top: 5px;
            color: #888;
            font-size: 12px;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn {
            background: #198754;
            color: white;
        }

        .save-btn:hover {
            background: #146c43;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
        }

        .logout-btn:hover {
            background: #bb2d3b;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
            min-height: 20px;
        }

        .error {
            color: #dc3545;
        }

        .success {
            color: #198754;
        }

        .info-box {
            margin-top: 28px;
            padding: 16px;
            background: #e9f7ef;
            border-radius: 10px;
            color: #146c43;
            line-height: 1.6;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .navbar {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .navbar a {
                margin: 0 7px;
                font-size: 14px;
            }

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .card {
                padding: 22px;
            }

            h1 {
                font-size: 25px;
            }

            .button-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="navbar">

    <strong>ClothSwap</strong>

    <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="listings.html">Listings</a>
        <a href="swap-requests.html">Swaps</a>
    </div>

</div>


<div class="container">

    <div class="card">

        <h1>👤 My Profile</h1>


        <!-- PROFILE IMAGE -->

        <div class="profile-section">

            <div class="profile-image-wrapper">

                <img
                    id="profileImage"
                    src=""
                    alt="Profile Image"
                >

            </div>

            <label
                for="imageInput"
                class="image-label"
            >
                📷 Choose Profile Image
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <div class="image-help">
                JPG, PNG or WEBP • Maximum 5 MB
            </div>

        </div>


        <!-- NAME -->

        <div class="field">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
            >

        </div>


        <!-- EMAIL -->

        <div class="field">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                readonly
            >

            <small>
                Email cannot be changed.
            </small>

        </div>


        <!-- PHONE -->

        <div class="field">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="text"
                id="phone"
                placeholder="Enter your phone number"
                maxlength="15"
            >

        </div>


        <!-- LOCATION -->

        <div class="field">

            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="Enter your city/location"
            >

        </div>


        <!-- ROLE -->

        <div class="field">

            <label for="role">
                Account Role
            </label>

            <input
                type="text"
                id="role"
                readonly
            >

        </div>


        <!-- BUTTONS -->

        <div class="button-row">

            <button
                class="save-btn"
                onclick="saveProfile()"
            >
                💾 Save Profile
            </button>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                🚪 Logout
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <div class="info-box">

            <strong>Profile Information</strong>

            <br>

            Your email and account role are protected
            and cannot be changed from this page.

            <br>

            You can update your name, phone number,
            location and profile picture anytime.

        </div>

    </div>

</div>


<script>

    let loggedInUser = null;


    /* =========================================
       DEFAULT PROFILE IMAGE
    ========================================== */

    function getDefaultProfileImage(name) {

        return (
            "https://api.dicebear.com/5.x/initials/svg?seed="
            +
            encodeURIComponent(name || "User")
        );
    }


    /* =========================================
       LOAD PROFILE IMAGE
    ========================================== */

    function loadProfileImage() {

        const image =
            document.getElementById("profileImage");

        if (!loggedInUser || !loggedInUser.id) {

            image.src =
                getDefaultProfileImage(
                    loggedInUser?.name
                );

            return;
        }

        const storageKey =
            "profileImage_" +
            loggedInUser.id;

        const savedImage =
            localStorage.getItem(storageKey);

        if (savedImage) {

            image.src = savedImage;

        } else {

            image.src =
                getDefaultProfileImage(
                    loggedInUser.name
                );
        }
    }


    /* =========================================
       LOAD CURRENT USER
       SECURE SESSION BASED
    ========================================== */

    async function loadProfile() {

        try {

            const response =
                await fetch(
                    "/api/auth/me",
                    {
                        method: "GET",
                        credentials: "include"
                    }
                );


            if (response.status === 401) {

                window.location.href =
                    "login.html";

                return;
            }


            if (!response.ok) {

                throw new Error(
                    "Unable to load current user"
                );
            }


            const user =
                await response.json();


            loggedInUser = user;


            /* Fill form */

            document.getElementById(
                "name"
            ).value =
                user.name || "";


            document.getElementById(
                "email"
            ).value =
                user.email || "";


            document.getElementById(
                "phone"
            ).value =
                user.phone || "";


            document.getElementById(
                "location"
            ).value =
                user.location || "";


            document.getElementById(
                "role"
            ).value =
                user.role || "USER";


            /* Save latest user locally
               for other frontend pages */

            localStorage.setItem(
                "loggedInUser",
                JSON.stringify(user)
            );


            loadProfileImage();


        } catch (error) {

            console.error(
                "Profile loading error:",
                error
            );


            showMessage(
                "Unable to load profile. Please login again.",
                "error"
            );

        }

    }


    /* =========================================
       SAVE PROFILE
    ========================================== */

    async function saveProfile() {

        if (!loggedInUser ||
            !loggedInUser.id) {

            showMessage(
                "Please login again.",
                "error"
            );

            return;
        }


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const location =
            document.getElementById(
                "location"
            ).value.trim();


        /* Validation */

        if (!name) {

            showMessage(
                "Name is required.",
                "error"
            );

            return;
        }


        if (phone &&
            !/^[0-9+\-\s()]{7,15}$/.test(phone)) {

            showMessage(
                "Please enter a valid phone number.",
                "error"
            );

            return;
        }


        if (!location) {

            showMessage(
                "Location is required.",
                "error"
            );

            return;
        }


        try {

            const response =
                await fetch(
                    "/api/auth/profile/" +
                    loggedInUser.id,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({

                            name: name,

                            phone: phone,

                            location: location

                        })
                    }
                );


            const result =
                await response.json()
                    .catch(() => ({}));


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Unable to update profile"
                );
            }


            loggedInUser =
                {
                    ...loggedInUser,
                    ...result
                };


            localStorage.setItem(
                "loggedInUser",
                JSON.stringify(
                    loggedInUser
                )
            );


            showMessage(
                "Profile updated successfully! ✅",
                "success"
            );


            loadProfileImage();


        } catch (error) {

            console.error(
                "Profile update error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to update profile.",
                "error"
            );

        }

    }


    /* =========================================
       PROFILE IMAGE
    ========================================== */

    document
        .getElementById("imageInput")
        .addEventListener(
            "change",
            function(event) {

                const file =
                    event.target.files[0];


                if (!file) {
                    return;
                }


                const maxSize =
                    5 * 1024 * 1024;


                if (file.size > maxSize) {

                    showMessage(
                        "Image size must be less than 5 MB.",
                        "error"
                    );

                    event.target.value = "";

                    return;
                }


                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {

                    showMessage(
                        "Please select a valid image file.",
                        "error"
                    );

                    event.target.value = "";

                    return;
                }


                const reader =
                    new FileReader();


                reader.onload =
                    function(e) {

                        resizeAndSaveImage(
                            e.target.result
                        );

                    };


                reader.onerror =
                    function() {

                        showMessage(
                            "Unable to read image.",
                            "error"
                        );

                    };


                reader.readAsDataURL(file);

            }
        );


    /* =========================================
       RESIZE PROFILE IMAGE
    ========================================== */

    function resizeAndSaveImage(
        imageData
    ) {

        const img =
            new Image();


        img.onload =
            function() {

                const canvas =
                    document.createElement(
                        "canvas"
                    );


                const maxWidth = 500;
                const maxHeight = 500;


                let width =
                    img.width;

                let height =
                    img.height;


                if (
                    width > maxWidth ||
                    height > maxHeight
                ) {

                    const ratio =
                        Math.min(
                            maxWidth / width,
                            maxHeight / height
                        );


                    width =
                        Math.round(
                            width * ratio
                        );

                    height =
                        Math.round(
                            height * ratio
                        );
                }


                canvas.width = width;
                canvas.height = height;


                const ctx =
                    canvas.getContext(
                        "2d"
                    );


                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                const compressedImage =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.85
                    );


                try {

                    const storageKey =
                        "profileImage_" +
                        loggedInUser.id;


                    localStorage.setItem(
                        storageKey,
                        compressedImage
                    );


                    document.getElementById(
                        "profileImage"
                    ).src =
                        compressedImage;


                    showMessage(
                        "Profile image updated successfully! ✅",
                        "success"
                    );


                } catch (error) {

                    console.error(error);


                    showMessage(
                        "Unable to save image. Choose a smaller image.",
                        "error"
                    );

                }

            };


        img.onerror =
            function() {

                showMessage(
                    "Invalid image file.",
                    "error"
                );

            };


        img.src = imageData;

    }


    /* =========================================
       MESSAGE
    ========================================== */

    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.innerText =
            text;


        message.className =
            "message " + type;


        setTimeout(
            () => {

                message.innerText = "";

            },
            4000
        );

    }


    /* =========================================
       LOGOUT
    ========================================== */

    async function logout() {

        try {

            await fetch(
                "/api/auth/logout",
                {
                    method: "POST",
                    credentials: "include"
                }
            );

        } catch (error) {

            console.error(error);

        }


        localStorage.removeItem(
            "loggedInUser"
        );


        window.location.href =
            "login.html";

    }


    /* =========================================
       START
    ========================================== */

    loadProfile();

</script>

</body>
</html>
